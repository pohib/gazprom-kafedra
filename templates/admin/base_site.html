{% extends "admin/base_site.html" %}
{% load static %}

{% block branding %}
<div style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-radius: 8px;
    margin: 0 -20px 20px -20px;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
">
    <a href="{% url 'admin:index' %}" style="
        text-decoration: none;
        color: yellow;
        font-size: clamp(16px, 4vw, 20px);
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        white-space: nowrap;
        margin-right: 20px;
    ">
        Панель администрирования
    </a>
    
    <div style="
        display: flex;
        gap: clamp(8px, 2vw, 15px);
        align-items: center;
    " id="stats-container">
        <div style="
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: clamp(7px, 2vw, 8px);
            font-weight: 600;
            min-width: clamp(50px, 15vw, 70px);
            min-height: clamp(32px, 10vw, 40px);
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: clamp(14px, 5vw, 18px); font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_total_visits|default:0 }}
            </div>
            <div style="font-size: clamp(8px, 2.5vw, 10px); opacity: 0.8; font-weight: 400;">всего</div>
        </div>
        
        <div style="
            background: rgba(16,185,129,0.3);
            border-radius: 16px;
            border: 1px solid rgba(16,185,129,0.4);
            font-size: clamp(7px, 2vw, 8px);
            font-weight: 600;
            min-width: clamp(50px, 15vw, 70px);
            min-height: clamp(32px, 10vw, 40px);
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: clamp(14px, 5vw, 18px); font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_today_visits|default:0 }}
            </div>
            <div style="font-size: clamp(8px, 2.5vw, 10px); opacity: 0.9; font-weight: 400;">сегодня</div>
        </div>
        
        <div style="
            background: rgba(245,158,11,0.3);
            border-radius: 16px;
            border: 1px solid rgba(245,158,11,0.4);
            font-size: clamp(7px, 2vw, 8px);
            font-weight: 600;
            min-width: clamp(50px, 15vw, 70px);
            min-height: clamp(32px, 10vw, 40px);
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: clamp(14px, 5vw, 18px); font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_week_visits|default:0 }}
            </div>
            <div style="font-size: clamp(8px, 2.5vw, 10px); opacity: 0.9; font-weight: 400;">неделя</div>
        </div>
    </div>
</div>

<style>
@media (max-width: 480px) {
    #stats-container {
        flex-direction: column !important;
        gap: 8px !important;
        align-items: flex-end !important;
    }
    #stats-container > div {
        min-width: 60px !important;
        width: 60px !important;
    }
}
@media (max-width: 360px) {
    #stats-container {
        display: none !important;
    }
}
</style>
{% endblock %}
