{% extends "admin/base_site.html" %}

{% block branding %}
<div style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-radius: 8px;
    margin: 0 -20px 20px -20px;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
">
    <a href="{% url 'admin:index' %}" style="
        text-decoration: none;
        color: yellow;
        font-size: 20px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        margin-right: 30px;
    ">
        Панель администрирования
    </a>
    
    <div style="
        display: flex;
        gap: 15px;
        align-items: center;
    ">
        <div style="
            background: rgba(255,255,255,0.15);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 8px;
            font-weight: 600;
            min-width: 70px;
            min-height: 40px;
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: 18px; font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_total_visits|default:0 }}
            </div>
            <div style="font-size: 10px; opacity: 0.8; font-weight: 400;">всего</div>
        </div>
        
        <div style="
            background: rgba(16,185,129,0.3);
            border-radius: 16px;
            border: 1px solid rgba(16,185,129,0.4);
            font-size: 8px;
            font-weight: 600;
            min-width: 70px;
            min-height: 40px;
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: 18px; font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_today_visits|default:0 }}
            </div>
            <div style="font-size: 10px; opacity: 0.9; font-weight: 400;">сегодня</div>
        </div>
        
        <div style="
            background: rgba(245,158,11,0.3);
            border-radius: 16px;
            border: 1px solid rgba(245,158,11,0.4);
            font-size: 8px;
            font-weight: 600;
            min-width: 70px;
            min-height: 40px;
            text-align: center;
            color: #e5e7eb;
        ">
            <div style="font-size: 18px; font-weight: 800; color: white; margin-bottom: 1px;">
                {{ admin_week_visits|default:0 }}
            </div>
            <div style="font-size: 10px; opacity: 0.9; font-weight: 400;">неделя</div>
        </div>
    </div>
</div>
{% endblock %}
